<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Симулятор струи</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: radial-gradient(circle at 50% 20%, #1a1a2e, #0a0a12 80%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    font-family: 'Segoe UI', Tahoma, sans-serif;
    color: #cfd8ff;
    padding-bottom: 20px;
  }

  h1 {
    margin: 15px 0 10px;
    font-size: 18px;
    letter-spacing: 2px;
    color: #8ab4ff;
    text-shadow: 0 0 14px #3a5cff;
    flex-shrink: 0;
  }

  #scene {
    position: relative;
    width: 100vw;
    height: 50vh; /* Увеличил для лучшего обзора */
    min-height: 300px;
    max-height: 500px;
    background: radial-gradient(ellipse at 50% 90%, #1c2440, #06060c 75%);
    box-shadow: inset 0 0 60px #000;
    overflow: hidden;
    flex-shrink: 0;
    border-top: 1px solid #1a2545;
    border-bottom: 1px solid #1a2545;
  }

  canvas { 
    display: block; 
    width: 100%; 
    height: 100%; 
  }

  #panel {
    width: 100vw;
    max-width: 100vw;
    display: flex;
    flex-direction: column;
    background: rgba(12, 18, 38, 0.98);
    padding: 10px 0;
  }

  .sliders-container {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px 14px;
    padding: 10px 14px;
    max-height: 30vh;
    overflow-y: auto;
  }

  .slider-box {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .slider-box label {
    font-size: 11px;
    display: flex;
    justify-content: space-between;
    color: #9fb4ff;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    white-space: nowrap;
  }

  .slider-box label span { 
    color: #e8f0ff; 
    font-weight: bold; 
  }

  input[type=range] {
    -webkit-appearance: none;
    appearance: none;
    height: 6px;
    border-radius: 3px;
    background: linear-gradient(90deg, #2a3a7a, #5a7aff);
    outline: none;
    width: 100%;
  }

  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 18px; 
    height: 18px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #cfe0ff, #4a6aff);
    box-shadow: 0 0 10px #5a8aff;
    cursor: pointer;
  }

  input[type=range]::-moz-range-thumb {
    width: 18px; 
    height: 18px;
    border: none;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #cfe0ff, #4a6aff);
    box-shadow: 0 0 10px #5a8aff;
    cursor: pointer;
  }

  #buttons {
    display: flex;
    justify-content: center;
    padding: 10px 14px;
    margin-top: 5px;
  }

  button {
    width: 100%;
    max-width: 320px;
    padding: 14px 20px;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 800;
    letter-spacing: 2px;
    cursor: pointer;
    text-transform: uppercase;
    transition: transform .08s, box-shadow .2s, background .3s;
  }

  #btnToggle {
    background: linear-gradient(180deg, #37d67a, #1a9e4e);
    color: #04140a;
    box-shadow: 0 0 20px #2ecc71aa;
  }

  #btnToggle.running {
    background: linear-gradient(180deg, #ff5c5c, #b81f1f);
    color: #1a0404;
    box-shadow: 0 0 20px #ff4040aa;
  }

  button:active { 
    transform: scale(0.97); 
  }

  @media (min-width: 768px) {
    #scene { 
      width: 100%; 
      max-width: 900px; 
      height: 60vh;
      border-radius: 18px 18px 0 0; 
      margin-top: 10px; 
    }
    #panel { 
      width: 900px; 
      border-radius: 0 0 14px 14px; 
      margin-bottom: 20px;
    }
    .sliders-container {
      grid-template-columns: repeat(4, 1fr);
      max-height: none;
    }
  }
</style>
</head>
<body>

<h1>СИМУЛЯТОР СТРУИ</h1>
<div id="scene"><canvas id="cv"></canvas></div>

<div id="panel">
  <div class="sliders-container">
    <div class="slider-box">
      <label>Сила <span id="v0">5.0</span></label>
      <input type="range" id="s0" min="0" max="10" step="0.1" value="5">
    </div>
    <div class="slider-box">
      <label>Объём <span id="v1">5.0</span></label>
      <input type="range" id="s1" min="0" max="10" step="0.1" value="5">
    </div>
    <div class="slider-box">
      <label>Влажность <span id="v2">5.0</span></label>
      <input type="range" id="s2" min="0" max="10" step="0.1" value="5">
    </div>
    <div class="slider-box">
      <label>Вязкость <span id="v3">5.0</span></label>
      <input type="range" id="s3" min="0" max="10" step="0.1" value="5">
    </div>
    <div class="slider-box">
      <label>Разброс <span id="v4">5.0</span></label>
      <input type="range" id="s4" min="0" max="10" step="0.1" value="5">
    </div>
    <div class="slider-box">
      <label>Турбулентность <span id="v5">5.0</span></label>
      <input type="range" id="s5" min="0" max="10" step="0.1" value="5">
    </div>
    <div class="slider-box">
      <label>Цвет <span id="v6">5.0</span></label>
      <input type="range" id="s6" min="0" max="10" step="0.1" value="5">
    </div>
    <div class="slider-box">
      <label>Плотность <span id="v7">5.0</span></label>
      <input type="range" id="s7" min="0" max="10" step="0.1" value="5">
    </div>
  </div>
  
  <div id="buttons">
    <button id="btnToggle">СТАРТ</button>
  </div>
</div>

<script>
(() => {
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  let W, H, DPR;

  function resize() {
    DPR = window.devicePixelRatio || 1;
    const rect = cv.parentElement.getBoundingClientRect();
    
    W = rect.width || cv.parentElement.offsetWidth || window.innerWidth;
    H = rect.height || cv.parentElement.offsetHeight || 300;

    cv.width = W * DPR; 
    cv.height = H * DPR;
    cv.style.width = W + 'px'; 
    cv.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  
  window.addEventListener('resize', resize);
  setTimeout(resize, 50); 
  resize();

  // ---------- ползунки ----------
  const sliders = [];
  for (let i = 0; i < 8; i++) {
    const el = document.getElementById('s' + i);
    const out = document.getElementById('v' + i);
    sliders.push({ el, out });
    el.addEventListener('input', () => { 
      out.textContent = (+el.value).toFixed(1); 
    });
  }
  const val = i => +sliders[i].el.value;

  // ---------- состояние ----------
  let running = false;
  const particles = [];
  const splashes = [];
  const mist = [];
  const ripples = [];
  let emitAcc = 0;
  let lastT = performance.now();

  // ---------- кнопка ----------
  const btnToggle = document.getElementById('btnToggle');
  btnToggle.addEventListener('click', () => {
    running = !running;
    if (running) {
      btnToggle.textContent = 'СТОП';
      btnToggle.classList.add('running');
    } else {
      btnToggle.textContent = 'СТАРТ';
      btnToggle.classList.remove('running');
    }
  });

  // ---------- геометрия унитаза ----------
  function getGeom() {
    const cx = W * 0.5;
    // Унитаз смещен вниз
    const baseY = H * 0.95;
    const tankH = H * 0.45;
    const tankW = Math.min(W * 0.45, 260);
    const tankY = baseY - tankH - H * 0.45;
    
    // Чаша
    const bowlW = Math.min(W * 0.5, 320);
    const bowlTop = tankY + tankH - 10;
    const bowlBottom = baseY - 30;
    
    // Вода
    const waterY = bowlBottom - (bowlBottom - bowlTop) * 0.3;
    
    // Струя падает из центра бачка
    const startX = cx;
    const startY = tankY + tankH * 0.5; 

    return { cx, baseY, tankY, tankW, tankH, bowlW, bowlTop, bowlBottom, waterY, startX, startY };
  }

  // ---------- цвет ----------
  function streamColor(t, alpha) {
    const r = Math.round(160 - 100 * t);
    const g = Math.round(120 - 80 * t);
    const b = Math.round(60 - 40 * t);
    return `rgba(${r},${g},${b},${alpha})`;
  }

  // ---------- рисование унитаза ----------
  function drawToilet() {
    const g = getGeom();
    const { cx, baseY, tankY, tankW, tankH, bowlW, bowlTop, bowlBottom, waterY } = g;

    // Тень на полу
    ctx.save();
    ctx.beginPath();
    ctx.ellipse(cx, baseY, bowlW * 0.8, 25, 0, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.filter = 'blur(10px)';
    ctx.fill();
    ctx.restore();

    // --- Сливной бачок ---
    const tankGrad = ctx.createLinearGradient(cx - tankW/2, tankY, cx + tankW/2, tankY + tankH);
    tankGrad.addColorStop(0, '#f0f4f8');
    tankGrad.addColorStop(0.3, '#d4dfeb');
    tankGrad.addColorStop(0.7, '#a9b8c9');
    tankGrad.addColorStop(1, '#7a8c9f');

    ctx.beginPath();
    ctx.roundRect(cx - tankW/2, tankY, tankW, tankH, 10);
    ctx.fillStyle = tankGrad;
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = 'rgba(255,255,255,0.6)';
    ctx.stroke();

    // Кнопка смыва на бачке
    ctx.beginPath();
    ctx.ellipse(cx, tankY + 15, 20, 6, 0, 0, Math.PI * 2);
    ctx.fillStyle = '#8296ab';
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(cx, tankY + 15, 18, 4.5, 0, 0, Math.PI * 2);
    ctx.fillStyle = '#dbe4ed';
    ctx.fill();

    // --- Основание / ножка ---
    const baseGrad = ctx.createLinearGradient(cx - bowlW/2, bowlTop, cx + bowlW/2, bowlBottom);
    baseGrad.addColorStop(0, '#f5f9ff');
    baseGrad.addColorStop(0.4, '#d4dfeb');
    baseGrad.addColorStop(1, '#7a8c9f');

    ctx.beginPath();
    ctx.moveTo(cx - tankW/2 + 10, tankY + tankH);
    ctx.lineTo(cx + tankW/2 - 10, tankY + tankH);
    ctx.bezierCurveTo(cx + tankW/3, tankY + tankH + 20, cx + bowlW/2, bowlTop + 40, cx + bowlW/2, bowlBottom);
    ctx.bezierCurveTo(cx + bowlW/2, bowlBottom + 20, cx - bowlW/2, bowlBottom + 20, cx - bowlW/2, bowlBottom);
    ctx.bezierCurveTo(cx - bowlW/2, bowlTop + 40, cx - tankW/3, tankY + tankH + 20, cx - tankW/2 + 10, tankY + tankH);
    ctx.fillStyle = baseGrad;
    ctx.fill();

    // --- Ободок (сиденье и крышка) ---
    ctx.beginPath();
    ctx.ellipse(cx, bowlTop + 15, bowlW/2, 40, 0, 0, Math.PI * 2);
    ctx.fillStyle = '#fff';
    ctx.fill();
    ctx.lineWidth = 6;
    ctx.strokeStyle = '#b0c0d0';
    ctx.stroke();

    // Внутренний ободок сиденья
    ctx.beginPath();
    ctx.ellipse(cx, bowlTop + 15, bowlW/2 - 15, 30, 0, 0, Math.PI * 2);
    ctx.fillStyle = '#e2eaf2';
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = '#a3b5c7';
    ctx.stroke();

    // --- Внутренняя чаша ---
    // Темное горло унитаза
    ctx.beginPath();
    ctx.moveTo(cx - bowlW/2 + 15, bowlTop + 15);
    ctx.bezierCurveTo(cx - bowlW/2 + 15, bowlTop + 100, cx - bowlW/3, bowlBottom - 40, cx, bowlBottom - 40);
    ctx.bezierCurveTo(cx + bowlW/3, bowlBottom - 40, cx + bowlW/2 - 15, bowlTop + 100, cx + bowlW/2 - 15, bowlTop + 15);
    ctx.fillStyle = '#3a4c5e';
    ctx.fill();

    // Сливное отверстие (дыра)
    ctx.beginPath();
    ctx.ellipse(cx, bowlBottom - 45, bowlW/6, 15, 0, 0, Math.PI * 2);
    ctx.fillStyle = '#1b2632';
    ctx.fill();

    // --- Вода ---
    const waterGrad = ctx.createLinearGradient(cx, waterY - 30, cx, bowlBottom);
    waterGrad.addColorStop(0, 'rgba(150,210,255,0.6)');
    waterGrad.addColorStop(1, 'rgba(30,80,140,0.9)');

    ctx.beginPath();
    ctx.ellipse(cx, waterY, bowlW/2 - 20, 25, 0, 0, Math.PI * 2);
    ctx.fillStyle = waterGrad;
    ctx.fill();

    // Блик на воде
    ctx.beginPath();
    ctx.ellipse(cx - bowlW*0.15, waterY - 5, bowlW*0.15, 8, -0.1, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    ctx.fill();

    // --- Слив из бачка (труба) ---
    ctx.beginPath();
    ctx.moveTo(cx - 30, tankY + tankH - 10);
    ctx.lineTo(cx - 30, tankY + tankH + 20);
    ctx.lineTo(cx + 30, tankY + tankH + 20);
    ctx.lineTo(cx + 30, tankY + tankH - 10);
    ctx.fillStyle = '#b0c0d0';
    ctx.fill();

    return g;
  }

  // ---------- физика ----------
  function spawnParticle() {
    const g = getGeom();
    const force = val(0);
    const volume = val(1);
    const wet = val(2);
    const viscosity = val(3);
    const spread = val(4);
    const turb = val(5);
    const tone = val(6) / 10;
    const density = val(7);

    // Частицы вылетают из "трубы" под бачком
    const startX = g.cx + (Math.random() - 0.5) * 40;
    const startY = g.tankY + g.tankH + 20;

    const vy = 2 + force * 1.2 + volume * 0.15; // Скорость падения
    const vx = (Math.random() - 0.5) * spread * 1.2;

    const isMist = Math.random() < wet * 0.08;

    const p = {
      x: startX,
      y: startY,
      vx,
      vy,
      r: (isMist ? 1.5 : 3.5) + volume * 0.65 + viscosity * 0.45 + Math.random() * 1.5,
      tone,
      density: 0.4 + density * 0.06,
      turb: turb * 0.08,
      life: 1,
      mist: isMist
    };
    if (isMist) mist.push(p); else particles.push(p);
  }

  function updateParticles(dt) {
    const g = getGeom();
    const waterY = g.waterY;
    const grav = 0.45;

    if (running) {
      const force = val(0);
      const volume = val(1);
      const rate = 10 + force * 10 + volume * 6; // Плотность струи
      emitAcc += rate * dt;
      while (emitAcc >= 1) {
        spawnParticle();
        emitAcc -= 1;
      }
    }

    // Тяжелые капли
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.vy += grav;
      p.vx += (Math.random() - 0.5) * p.turb;
      p.vx *= 0.99;
      p.x += p.vx;
      p.y += p.vy;

      // Попадание в воду
      if (p.y >= waterY) {
        createSplash(p.x, waterY, p);
        particles.splice(i, 1);
      } else if (p.y > H + 50) {
        particles.splice(i, 1);
      }
    }

    // Взвесь / брызги
    for (let i = mist.length - 1; i >= 0; i--) {
      const p = mist[i];
      p.vy += grav * 0.5;
      p.vx += (Math.random() - 0.5) * p.turb * 2;
      p.x += p.vx;
      p.y += p.vy;
      p.life -= 0.015;
      if (p.life <= 0 || p.y > waterY) mist.splice(i, 1);
    }

    // Отскок капель при попадании
    for (let i = splashes.length - 1; i >= 0; i--) {
      const s = splashes[i];
      s.vy += grav * 1.2;
      s.x += s.vx;
      s.y += s.vy;
      s.life -= 0.03;
      if (s.life <= 0 || s.y > waterY + 40) splashes.splice(i, 1);
    }

    // Круги на воде
    for (let i = ripples.length - 1; i >= 0; i--) {
      const r = ripples[i];
      r.rad += 1.5;
      r.life -= 0.03;
      if (r.life <= 0) ripples.splice(i, 1);
    }
  }

  function createSplash(x, y, p) {
    const n = 3 + Math.floor(p.r * 0.8);
    for (let i = 0; i < n; i++) {
      splashes.push({
        x, y: y - 5,
        vx: (Math.random() - 0.5) * (4 + p.tone * 3),
        vy: -2 - Math.random() * 4,
        r: 1 + Math.random() * 2.5,
        tone: p.tone,
        life: 0.8 + Math.random() * 0.2
      });
    }
    ripples.push({ x, y, rad: 5, life: 0.8, tone: p.tone });
  }

  // ---------- отрисовка ----------
  function draw() {
    ctx.clearRect(0, 0, W, H);

    // Фон
    const bg = ctx.createRadialGradient(W * 0.5, H * 0.9, 50, W * 0.5, H * 0.9, W * 0.9);
    bg.addColorStop(0, 'rgba(28,36,64,1)');
    bg.addColorStop(1, 'rgba(6,6,12,1)');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    drawToilet();
    const g = getGeom();

    // Круги на воде
    for (const r of ripples) {
      ctx.beginPath();
      ctx.ellipse(r.x, r.y, r.rad, r.rad * 0.28, 0, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(220,240,255,${r.life * 0.8})`;
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    // Мелкие частицы
    ctx.save();
    for (const p of mist) {
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = streamColor(p.tone, p.life * 0.4 * p.density);
      ctx.fill();
    }
    ctx.restore();

    // Основная струя (капли)
    ctx.save();
    for (const p of particles) {
      const grd = ctx.createRadialGradient(p.x - p.r * 0.3, p.y - p.r * 0.3, p.r * 0.2, p.x, p.y, p.r);
      grd.addColorStop(0, streamColor(p.tone, 0.95 * p.density));
      grd.addColorStop(1, streamColor(Math.min(1, p.tone + 0.25), 0.7 * p.density));
      ctx.beginPath();
      // Капли чуть вытянуты по вертикали
      ctx.ellipse(p.x, p.y, p.r, p.r * 1.3, 0, 0, Math.PI * 2);
      ctx.fillStyle = grd;
      ctx.fill();
    }
    ctx.restore();

    // Брызги
    for (const s of splashes) {
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fillStyle = streamColor(s.tone, s.life);
      ctx.fill();
    }

    // Виньетка
    const vg = ctx.createRadialGradient(W * 0.5, H * 0.5, H * 0.4, W * 0.5, H * 0.5, H * 0.9);
    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(1, 'rgba(0,0,0,0.6)');
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, W, H);
  }

  // ---------- цикл ----------
  function loop(t) {
    const dt = Math.min(3, (t - lastT) / 16.6667);
    lastT = t;
    updateParticles(dt);
    draw();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
